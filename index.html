<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://restuarant-finder-link.shivank-sharma.workers.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Proven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #0e0c0a;
      --cream:       #f0ebe0;
      --gold:        #c49e50;
      --gold-border: rgba(196,158,80,0.28);
      --gold-dim:    rgba(196,158,80,0.08);
      --secondary:   #8a8070;
      --muted:       #5a5040;
      --border:      rgba(240,235,224,0.09);
      --card-sep:    rgba(240,235,224,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--cream);
      min-height: 100vh;
    }

    /* Ambient radial gradient — fixed so it stays as content scrolls */
    body::before {
      content: '';
      position: fixed;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 150vw);
      height: 600px;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(196,158,80,0.09) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 90%, rgba(196,158,80,0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    header {
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .header-content {
      max-width: 480px;
      margin: 0 auto;
      padding: 52px 24px 36px;
    }


    .header-eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
      animation: pulse-dot 2.2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(196,158,80,0.5); }
      50%       { opacity: 0.65; box-shadow: 0 0 0 5px rgba(196,158,80,0); }
    }

    .eyebrow-text {
      font-size: 0.67rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--secondary);
    }

    .app-title {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-size: 58px;
      font-weight: 700;
      color: var(--cream);
      line-height: 1;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .app-title em {
      font-style: italic;
      color: var(--gold);
    }

    .header-divider {
      width: 36px;
      height: 1px;
      background: var(--gold-border);
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .tagline {
      font-size: 0.77rem;
      color: var(--secondary);
      line-height: 1.65;
      max-width: 320px;
      position: relative;
      z-index: 1;
    }

    /* ── Skyline strip ───────────────────────────────────────────── */
    .skyline {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 72px;
      padding: 0 24px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* Soft fade at bottom of skyline */
    .skyline::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 24px;
      background: linear-gradient(to top, var(--bg), transparent);
      pointer-events: none;
    }

    .skyline-bar {
      flex: 1;
      min-width: 0;
      background: linear-gradient(to top, var(--gold), rgba(196,158,80,0.18));
      border-radius: 1px 1px 0 0;
      transform-origin: bottom;
      will-change: transform;
      animation: breathe 3s ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }

    @keyframes breathe {
      0%, 100% { transform: scaleY(1);    opacity: 0.55; }
      50%       { transform: scaleY(0.5); opacity: 0.25; }
    }

    /* ── Search section (sticky) ─────────────────────────────────── */
    .search-section {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14,12,10,0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .search-inner {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 24px 18px;
    }

    .input-label {
      display: block;
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .search-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    #locationInput {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      background: rgba(240,235,224,0.04);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-style: italic;
      font-size: 0.88rem;
      color: var(--cream);
      outline: none;
      transition: border-color 0.15s;
    }

    #locationInput::placeholder {
      color: var(--muted);
      font-style: italic;
    }

    #locationInput:focus {
      border-color: var(--gold);
    }

    #searchBtn {
      padding: 11px 18px;
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: 3px;
      color: var(--gold);
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }

    #searchBtn:hover {
      background: var(--gold);
      color: var(--bg);
    }

    #searchBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Radius row */
    .radius-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .radius-control > label {
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
    }

    #radiusSlider {
      --fill: 100%;
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(
        to right,
        var(--gold) var(--fill),
        rgba(240,235,224,0.13) var(--fill)
      );
      cursor: pointer;
      outline: none;
    }

    #radiusSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--gold);
      cursor: pointer;
      transition: transform 0.1s;
    }

    #radiusSlider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    #radiusSlider::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--gold);
      cursor: pointer;
    }

    .radius-label {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold);
      min-width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Open Now toggle */
    .toggle-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--secondary);
      cursor: pointer;
      user-select: none;
    }

    .toggle-wrap input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .toggle-track {
      width: 32px;
      height: 18px;
      border-radius: 9px;
      background: rgba(240,235,224,0.07);
      border: 1px solid var(--border);
      position: relative;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .toggle-wrap input[type="checkbox"]:checked + .toggle-track {
      background: rgba(196,158,80,0.18);
      border-color: var(--gold-border);
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      transition: left 0.18s, background 0.18s;
    }

    .toggle-wrap input[type="checkbox"]:checked + .toggle-track .toggle-thumb {
      left: 16px;
      background: var(--gold);
    }

    /* Search bottom controls row */
    .search-controls-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Cuisine filter row */
    .filter-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-top: 12px;
    }

    .cuisine-wrap {
      position: relative;
    }

    .cuisine-trigger {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--secondary);
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.77rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .cuisine-trigger:hover {
      border-color: var(--gold-border);
      color: var(--cream);
    }

    .cuisine-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: #1c1814;
      border: 1px solid var(--border);
      border-radius: 5px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      padding: 8px;
      z-index: 200;
      min-width: 180px;
      max-height: 260px;
      overflow-y: auto;
    }

    .cuisine-panel.open {
      display: block;
    }

    .cuisine-option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--secondary);
      cursor: pointer;
      border-radius: 3px;
    }

    .cuisine-option:hover {
      background: var(--gold-dim);
      color: var(--cream);
    }

    .cuisine-option input[type="checkbox"] {
      accent-color: var(--gold);
      cursor: pointer;
    }

    /* ── Status ──────────────────────────────────────────────────── */
    .status {
      max-width: 480px;
      margin: 0 auto;
      padding: 10px 24px;
      font-size: 0.8rem;
      color: var(--secondary);
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .status.error { color: #b06060; }

    .spinner {
      width: 13px;
      height: 13px;
      border: 1.5px solid rgba(240,235,224,0.08);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Stats strip ─────────────────────────────────────────────── */
    .stats-strip {
      display: flex;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .stat-block {
      flex: 1;
      padding: 16px 0;
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .stat-block:last-child {
      border-right: none;
    }

    .stat-number {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Results meta / header ───────────────────────────────────── */
    .results-meta {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 24px 10px;
      position: relative;
      z-index: 1;
    }

    .results-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .results-header-left {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--secondary);
    }

    .results-count {
      color: var(--gold);
      font-style: italic;
      font-weight: 700;
    }

    .results-header-right {
      font-size: 0.67rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    .fallback-notice {
      font-size: 0.78rem;
      color: var(--secondary);
      background: rgba(196,158,80,0.06);
      border: 1px solid var(--gold-border);
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    /* ── Results list ────────────────────────────────────────────── */
    .results {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 24px 60px;
      position: relative;
      z-index: 1;
    }

    /* ── Card ────────────────────────────────────────────────────── */
    .card {
      border-top: 1px solid var(--card-sep);
      padding: 22px 0;
    }

    /* Card top row: name group left, rating block right */
    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
    }

    .card-name-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .card-num {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-name {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--cream);
      line-height: 1.2;
    }

    /* Rating block — stars + score + count stacked right */
    .card-rating-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .stars-row {
      display: flex;
      gap: 1px;
    }

    .rating-score {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }

    .review-count {
      font-size: 0.63rem;
      color: var(--muted);
      text-align: right;
    }

    /* Crowd bar row */
    .crowd-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .crowd-bar-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
      min-width: 58px;
    }

    .crowd-segs {
      display: flex;
      gap: 2px;
      flex: 1;
    }

    .crowd-seg {
      flex: 1;
      height: 5px;
      border-radius: 1px;
      background: rgba(240,235,224,0.05);
      border: 1px solid rgba(240,235,224,0.07);
    }

    .crowd-seg.filled {
      background: var(--gold);
      border-color: var(--gold);
    }

    .crowd-bar-text {
      font-size: 0.63rem;
      color: var(--secondary);
      flex-shrink: 0;
      min-width: 50px;
      text-align: right;
    }

    /* Tags */
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 9px;
    }

    .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 2px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.67rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      border: 1px solid;
    }

    .tag-price   { color: var(--secondary); border-color: var(--border); }
    .tag-cuisine { color: var(--secondary); border-color: var(--border); }
    .tag-open    { color: #6b9e6b; border-color: rgba(107,158,107,0.28); }
    .tag-closed  { color: #9e6b6b; border-color: rgba(158,107,107,0.28); }

    .card-address {
      font-size: 0.73rem;
      color: var(--muted);
      font-style: italic;
    }

    /* Open Hours Unknown divider */
    .unknown-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 18px 0 4px;
    }

    .unknown-divider::before,
    .unknown-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Empty state */
    .empty-state {
      padding: 60px 0;
      text-align: center;
      color: var(--secondary);
      font-size: 0.88rem;
    }

    .empty-state svg {
      display: block;
      margin: 0 auto 20px;
      opacity: 0.18;
      color: var(--gold);
    }

    .empty-state strong {
      display: block;
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-size: 1rem;
      color: var(--cream);
      margin-bottom: 6px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .skyline-bar   { animation: none; }
      .eyebrow-dot   { animation: none; }
      .spinner       { animation: none; }
    }

    /* ── Site footer ─────────────────────────────────────────────── */
    .site-footer {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 24px 40px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    .site-footer a {
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.15s;
    }

    .site-footer a:hover {
      color: var(--gold);
    }
  </style>
</head>
<body>

<!-- Shared SVG defs: half-star gradient, referenced by all star SVGs -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;" aria-hidden="true">
  <defs>
    <linearGradient id="starHalfGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
</svg>

<header>
  <div class="header-content">
    <h1 class="app-title">Pro<em>ven</em></h1>
    <div class="header-divider" aria-hidden="true"></div>
    <p class="tagline">The restaurants a city chooses, again and again. Only places with 1,000+ reviews make the list.</p>
  </div>
</header>

<!-- Animated skyline strip -->
<div class="skyline" aria-hidden="true">
  <div class="skyline-bar" style="height:45px;--d:0s"></div>
  <div class="skyline-bar" style="height:60px;--d:.4s"></div>
  <div class="skyline-bar" style="height:28px;--d:.8s"></div>
  <div class="skyline-bar" style="height:55px;--d:1.2s"></div>
  <div class="skyline-bar" style="height:72px;--d:1.6s"></div>
  <div class="skyline-bar" style="height:38px;--d:2.0s"></div>
  <div class="skyline-bar" style="height:65px;--d:.2s"></div>
  <div class="skyline-bar" style="height:48px;--d:.6s"></div>
  <div class="skyline-bar" style="height:30px;--d:1.0s"></div>
  <div class="skyline-bar" style="height:70px;--d:1.4s"></div>
  <div class="skyline-bar" style="height:42px;--d:1.8s"></div>
  <div class="skyline-bar" style="height:58px;--d:.1s"></div>
  <div class="skyline-bar" style="height:35px;--d:.5s"></div>
  <div class="skyline-bar" style="height:68px;--d:.9s"></div>
  <div class="skyline-bar" style="height:52px;--d:1.3s"></div>
  <div class="skyline-bar" style="height:40px;--d:1.7s"></div>
  <div class="skyline-bar" style="height:62px;--d:2.1s"></div>
  <div class="skyline-bar" style="height:25px;--d:.3s"></div>
  <div class="skyline-bar" style="height:55px;--d:.7s"></div>
  <div class="skyline-bar" style="height:44px;--d:1.1s"></div>
</div>

<div class="search-section">
  <div class="search-inner">
    <label class="input-label" for="locationInput">Location</label>
    <div class="search-input-row">
      <input id="locationInput" type="text" maxlength="100"
             placeholder="Enter ZIP code or city name (e.g. 10001 or Austin, TX)"
             data-testid="location-input" />
      <button id="searchBtn" onclick="startSearch()" data-testid="search-button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Search
      </button>
    </div>
    <div class="radius-control">
      <label for="radiusSlider">Radius</label>
      <input id="radiusSlider" type="range" min="1" max="5" step="0.5" value="5"
             oninput="updateRadiusLabel()" data-testid="radius-slider" />
      <span id="radiusLabel" class="radius-label" data-testid="radius-label">5 mi</span>
    </div>
    <div class="search-controls-row">
      <label class="toggle-wrap" data-testid="open-now-toggle">
        <input type="checkbox" id="openNowToggle" onchange="onOpenNowChange()" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        Open Now
      </label>
      <!-- Cuisine filter row — hidden until results load, shown by populateCuisineDropdown() -->
      <div class="filter-row" id="filterRow" style="display:none">
        <div class="cuisine-wrap" id="cuisineWrap">
          <button class="cuisine-trigger" id="cuisineTrigger" onclick="toggleCuisinePanel()">All cuisines &#x25be;</button>
          <div class="cuisine-panel" id="cuisinePanel" role="listbox" aria-multiselectable="true"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="stats-strip" id="statsStrip" style="display:none">
  <div class="stat-block">
    <div class="stat-number" id="statsCount">—</div>
    <div class="stat-label">Venues Found</div>
  </div>
  <div class="stat-block">
    <div class="stat-number">1,000+</div>
    <div class="stat-label">Min Reviews</div>
  </div>
  <div class="stat-block">
    <div class="stat-number" id="statsRadius">5 mi</div>
    <div class="stat-label">Radius</div>
  </div>
</div>

<div id="status" class="status" data-testid="status"></div>
<div id="resultsMeta" class="results-meta" data-testid="results-meta"></div>
<div id="results" class="results" data-testid="results"></div>

<script>
  const WORKER = 'https://restuarant-finder-link.shivank-sharma.workers.dev/';

  const PRICE_LABELS = { 0: 'Free', 1: '$', 2: '$$', 3: '$$$', 4: '$$$$' };
  const MIN_REVIEWS  = 1000;

  // Filter state — module-level so selections persist across searches
  let baseResults      = []; // 1000+-qualified places, Bayesian-ranked; populated once per search
  let selectedCuisines = new Set(); // empty Set = no filter (all cuisines shown)
  // ZIP fallback state — set when input is a 5-digit ZIP and the first search yields no qualified
  // results; holds { zip, city, state } so runZipFallback() can retry from the city centre
  let zipFallbackData      = null;
  // Persists the fallback notice { zip, city, state } across filter changes so applyFilters()
  // can re-render the notice after cuisine / open-now filtering without a new search
  let currentFallbackNotice = null;

  function getRadiusMiles() {
    return parseFloat(document.getElementById('radiusSlider').value);
  }

  function getRadiusMeters() {
    return Math.round(getRadiusMiles() * 1609.34);
  }

  function updateRadiusLabel() {
    const slider = document.getElementById('radiusSlider');
    const miles = parseFloat(slider.value);
    document.getElementById('radiusLabel').textContent = miles + ' mi';
    // Update gold fill to thumb position
    const pct = ((miles - parseFloat(slider.min)) / (parseFloat(slider.max) - parseFloat(slider.min))) * 100;
    slider.style.setProperty('--fill', pct + '%');
  }

  function workerFetch(endpoint, params) {
    const paramStr = new URLSearchParams(params).toString();
    const url = `${WORKER}?endpoint=${encodeURIComponent(endpoint)}&params=${encodeURIComponent(paramStr)}`;
    return fetch(url).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
  }

  function setStatus(msg, isError = false, loading = false) {
    const el = document.getElementById('status');
    el.className = 'status' + (isError ? ' error' : '');
    el.innerHTML = '';
    if (loading) {
      const spinner = document.createElement('div');
      spinner.className = 'spinner';
      el.appendChild(spinner);
    }
    if (msg) el.appendChild(document.createTextNode(msg));
  }

  function startSearch() {
    const raw = document.getElementById('locationInput').value.trim();
    if (!raw) { setStatus('Please enter a ZIP code or city name.', true); return; }

    document.getElementById('results').innerHTML = '';
    document.getElementById('resultsMeta').innerHTML = '';
    setStatus('Geocoding location...', false, true);
    document.getElementById('searchBtn').disabled = true;

    workerFetch('maps/api/geocode/json', { address: raw })
      .then(data => {
        if (data.status !== 'OK' || !data.results.length) {
          setStatus(`Could not find location "${raw}". Try a different ZIP or city.`, true);
          document.getElementById('searchBtn').disabled = false;
          return;
        }

        // For 5-digit ZIP searches: capture city and state from the geocoding response so that,
        // if no restaurants pass the MIN_REVIEWS filter, runZipFallback() can retry the search
        // centred on the city rather than the ZIP centroid (which may be in a residential area).
        zipFallbackData       = null;
        currentFallbackNotice = null;
        if (/^\d{5}$/.test(raw)) {
          try {
            const comps      = data.results[0].address_components;
            const cityComp   = comps.find(c => c.types.includes('locality'));
            const stateComp  = comps.find(c => c.types.includes('administrative_area_level_1'));
            if (cityComp && stateComp) {
              zipFallbackData = { zip: raw, city: cityComp.long_name, state: stateComp.short_name };
            }
          } catch (e) {
            // Extraction failed — ZIP fallback silently disabled for this search
          }
        }

        searchRestaurants(data.results[0].geometry.location);
      })
      .catch(() => {
        setStatus('Could not reach the search service. Please check your network connection.', true);
        document.getElementById('searchBtn').disabled = false;
      });
  }

  function searchRestaurants(location, fallbackNotice) {
    setStatus('Searching for restaurants...', false, true);
    const allResults = [];

    function fetchPage(pageToken) {
      // On paginated requests send only pagetoken; Google ignores other params
      // when pagetoken is present and some proxies reject the extra fields.
      const params = pageToken
        ? { pagetoken: pageToken }
        : { location: `${location.lat},${location.lng}`, radius: getRadiusMeters(), type: 'restaurant' };

      workerFetch('maps/api/place/nearbysearch/json', params)
        .then(data => {
          if (data.status === 'OK') {
            allResults.push(...data.results);
            if (data.next_page_token) {
              // Google requires ~2s before next_page_token becomes valid
              setTimeout(() => fetchPage(data.next_page_token), 2000);
            } else {
              renderResults(allResults, fallbackNotice);
            }
          } else if (data.status === 'ZERO_RESULTS') {
            // May happen on a subsequent page; show whatever we already have
            if (allResults.length) {
              renderResults(allResults, fallbackNotice);
            } else if (zipFallbackData) {
              // ZIP search returned nothing at all from Google — try the city centre
              const fallback = zipFallbackData;
              zipFallbackData = null;
              runZipFallback(fallback);
            } else {
              setStatus('No restaurants found near that location.');
              document.getElementById('searchBtn').disabled = false;
            }
          } else {
            // On a mid-pagination error, render whatever was already fetched
            if (allResults.length) {
              renderResults(allResults, fallbackNotice);
            } else {
              setStatus(`Places API error: ${data.status}`, true);
              document.getElementById('searchBtn').disabled = false;
            }
          }
        })
        .catch(() => {
          if (allResults.length) {
            renderResults(allResults, fallbackNotice);
          } else {
            setStatus('Could not reach the search service. Please check your network connection.', true);
            document.getElementById('searchBtn').disabled = false;
          }
        });
    }

    fetchPage(null);
  }

  // ZIP fallback: geocodes the city extracted from the original ZIP geocoding response, then
  // re-runs the restaurant search centred on the city. Called only when a ZIP search yields
  // zero qualified results and city/state extraction succeeded in startSearch().
  function runZipFallback(fallback) {
    const cityQuery = fallback.city + ', ' + fallback.state;
    setStatus('Searching nearby city...', false, true);
    workerFetch('maps/api/geocode/json', { address: cityQuery })
      .then(geoData => {
        if (geoData.status === 'OK' && geoData.results.length) {
          searchRestaurants(geoData.results[0].geometry.location, fallback);
        } else {
          showEmptyState();
        }
      })
      .catch(() => showEmptyState());
  }

  function showEmptyState() {
    document.getElementById('searchBtn').disabled = false;
    setStatus('');
    document.getElementById('resultsMeta').innerHTML = '';
    document.getElementById('filterRow').style.display = 'none';
    const statsEl = document.getElementById('statsStrip');
    if (statsEl) statsEl.style.display = 'none';
    document.getElementById('results').innerHTML = `
      <div class="empty-state">
        <svg width="88" height="88" viewBox="0 0 88 88" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="34" cy="50" r="22" stroke-width="2.5"/>
          <circle cx="34" cy="50" r="13" stroke-width="1.5"/>
          <line x1="10" y1="26" x2="10" y2="36" stroke-width="2.5"/>
          <line x1="7"  y1="26" x2="7"  y2="32" stroke-width="1.5"/>
          <line x1="13" y1="26" x2="13" y2="32" stroke-width="1.5"/>
          <line x1="10" y1="36" x2="10" y2="48" stroke-width="2.5"/>
          <path d="M58 26 C58 26 62 30 62 36 L60 42 L60 52" stroke-width="2.5"/>
          <circle cx="60" cy="28" r="16" stroke-width="3"/>
          <line x1="72" y1="40" x2="82" y2="50" stroke-width="3.5"/>
        </svg>
        <strong>No results found</strong>
        No restaurants with 1,000+ reviews found within ${getRadiusMiles()} mile${getRadiusMiles() === 1 ? '' : 's'}.
        <br>Try a different location or city center.
      </div>`;
  }

  // Inline SVG stars — reference shared gradient in <defs> above for half star
  const STAR_FULL  = '<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#fbbf24"/></svg>';
  const STAR_HALF  = '<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="url(#starHalfGrad)"/></svg>';
  const STAR_EMPTY = '<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#d1d5db"/></svg>';

  function starsHtml(rating) {
    const full  = Math.floor(rating);
    const half  = rating - full >= 0.5 ? 1 : 0;
    const empty = 5 - full - half;
    return STAR_FULL.repeat(full) + (half ? STAR_HALF : '') + STAR_EMPTY.repeat(empty);
  }

  // Keyword → cuisine, matched against lowercased restaurant name
  const NAME_KEYWORDS = [
    ['indian', 'Indian'], ['india', 'Indian'],
    ['madras', 'Indian'], ['tandoor', 'Indian'], ['curry', 'Indian'],
    ['biryani', 'Indian'], ['masala', 'Indian'], ['punjabi', 'Indian'],
    ['kerala', 'Indian'], ['dosa', 'Indian'], ['idli', 'Indian'],
    ['mughal', 'Indian'], ['spice', 'Indian'], ['chai', 'Indian'],
    ['sushi', 'Japanese'], ['ramen', 'Japanese'], ['udon', 'Japanese'],
    ['tempura', 'Japanese'], ['japanese', 'Japanese'], ['izakaya', 'Japanese'],
    ['teriyaki', 'Japanese'], ['yakitori', 'Japanese'],
    ['taco', 'Mexican'], ['burrito', 'Mexican'], ['mexican', 'Mexican'],
    ['cantina', 'Mexican'], ['hacienda', 'Mexican'], ['enchilada', 'Mexican'],
    ['pizza', 'Italian'], ['italian', 'Italian'], ['trattoria', 'Italian'],
    ['osteria', 'Italian'], ['pasta', 'Italian'],
    ['chinese', 'Chinese'], ['dim sum', 'Chinese'], ['wok', 'Chinese'],
    ['szechuan', 'Chinese'], ['sichuan', 'Chinese'], ['cantonese', 'Chinese'],
    ['pho', 'Vietnamese'], ['vietnamese', 'Vietnamese'], ['viet', 'Vietnamese'],
    ['banh mi', 'Vietnamese'],
    ['mediterranean', 'Mediterranean'], ['falafel', 'Mediterranean'],
    ['hummus', 'Mediterranean'], ['greek', 'Greek'], ['gyro', 'Greek'],
    ['lebanese', 'Lebanese'], ['shawarma', 'Middle Eastern'],
    ['kebab', 'Middle Eastern'], ['persian', 'Middle Eastern'],
    ['turkish', 'Turkish'],
    ['burger', 'American'], ['bbq', 'BBQ'], ['barbecue', 'BBQ'],
    ['steakhouse', 'Steakhouse'], ['steak', 'Steakhouse'],
    ['seafood', 'Seafood'], ['fish', 'Seafood'], ['crab', 'Seafood'],
    ['french', 'French'], ['brasserie', 'French'], ['bistro', 'French'],
    ['spanish', 'Spanish'], ['tapas', 'Spanish'],
    ['vegan', 'Vegan'], ['vegetarian', 'Vegetarian'],
  ];

  // Types-based fallback (generic)
  const TYPE_CUISINE = {
    indian_restaurant: 'Indian', japanese_restaurant: 'Japanese',
    chinese_restaurant: 'Chinese', mexican_restaurant: 'Mexican',
    italian_restaurant: 'Italian', thai_restaurant: 'Thai',
    vietnamese_restaurant: 'Vietnamese', korean_restaurant: 'Korean',
    mediterranean_restaurant: 'Mediterranean', greek_restaurant: 'Greek',
    french_restaurant: 'French', american_restaurant: 'American',
    barbecue_restaurant: 'BBQ', seafood_restaurant: 'Seafood',
    pizza_restaurant: 'Pizza', sushi_restaurant: 'Sushi',
    ramen_restaurant: 'Ramen', steak_house: 'Steakhouse',
    hamburger_restaurant: 'Burgers', fast_food_restaurant: 'Fast Food',
    breakfast_restaurant: 'Breakfast', bakery: 'Bakery',
    cafe: 'Cafe', bar: 'Bar & Grill', coffee_shop: 'Coffee Shop',
  };

  function getCuisine(place) {
    const name = (place.name || '').toLowerCase();

    // Pass 1: keyword match on restaurant name (most reliable)
    for (const [kw, label] of NAME_KEYWORDS) {
      if (name.includes(kw)) return label;
    }

    // Pass 2: specific type from Places API
    for (const type of (place.types || [])) {
      if (TYPE_CUISINE[type]) return TYPE_CUISINE[type];
    }

    return 'Restaurant';
  }

  // Bayesian rating formula: score = (C * m + R * v) / (m + v)
  // C = mean rating of all qualified results in this search (the global prior)
  // m = 1000 = prior weight — treats every place as though it has 1000 average-rated reviews to start;
  //            places with few real reviews are pulled toward the mean, reducing flukes
  // R = this place's actual rating
  // v = this place's review count
  function bayesianScore(C, m, R, v) {
    return (C * m + R * v) / (m + v);
  }

  function renderResults(all, fallbackNotice) {
    document.getElementById('searchBtn').disabled = false;

    const qualified = all.filter(p => p.user_ratings_total >= MIN_REVIEWS && p.rating);

    if (!qualified.length) {
      // ZIP fallback: first search yielded no qualified results — retry from the city centre
      if (zipFallbackData) {
        const fallback = zipFallbackData;
        zipFallbackData = null;
        runZipFallback(fallback);
        return;
      }
      showEmptyState();
      return;
    }

    // Compute Bayesian scores once per result set; C is the mean of this specific result set
    const m = 1000;
    const C = qualified.reduce((s, p) => s + p.rating, 0) / qualified.length;
    baseResults = qualified
      .map(p => Object.assign({}, p, { _score: bayesianScore(C, m, p.rating, p.user_ratings_total) }))
      .sort((a, b) => b._score - a._score);

    // Store the fallback notice (if any) so applyFilters() can re-render it on filter changes
    currentFallbackNotice = fallbackNotice || null;

    // Derive cuisine options once from baseResults, before any filtering
    const cuisineSet = new Set(baseResults.map(getCuisine));
    populateCuisineDropdown(cuisineSet);

    applyFilters();
  }

  // Build cuisine checkboxes; preserve prior selection where cuisines still exist in new results
  function populateCuisineDropdown(cuisines) {
    const panel = document.getElementById('cuisinePanel');
    while (panel.firstChild) panel.removeChild(panel.firstChild);

    Array.from(cuisines).sort().forEach(cuisine => {
      const lbl = document.createElement('label');
      lbl.className = 'cuisine-option';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = cuisine;
      // selectedCuisines empty = all shown; otherwise check only previously selected cuisines
      cb.checked = selectedCuisines.size === 0 || selectedCuisines.has(cuisine);
      cb.addEventListener('change', onCuisineChange);

      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode('\u00a0' + cuisine));
      panel.appendChild(lbl);
    });

    document.getElementById('filterRow').style.display = '';
    updateCuisineTriggerLabel();
  }

  function updateCuisineTriggerLabel() {
    const btn = document.getElementById('cuisineTrigger');
    if (!btn) return;
    if (selectedCuisines.size === 0) {
      btn.textContent = 'All cuisines \u25be';
    } else {
      const names = Array.from(selectedCuisines).sort();
      const label = names.length <= 2
        ? names.join(', ')
        : names[0] + ' +' + (names.length - 1) + ' more';
      btn.textContent = label + ' \u25be';
    }
  }

  function toggleCuisinePanel() {
    document.getElementById('cuisinePanel').classList.toggle('open');
  }

  function onCuisineChange() {
    const checkboxes = Array.from(document.querySelectorAll('#cuisinePanel input[type="checkbox"]'));
    const checked = checkboxes.filter(cb => cb.checked).map(cb => cb.value);
    // All checked → empty set sentinel (no filter); some checked → filter to those
    selectedCuisines = checked.length === checkboxes.length ? new Set() : new Set(checked);
    updateCuisineTriggerLabel();
    applyFilters();
  }

  function onOpenNowChange() {
    applyFilters();
  }

  // Single shared function for all filter combinations (cuisine + Open Now)
  function applyFilters() {
    if (!baseResults.length) return;

    const openNowOn = document.getElementById('openNowToggle').checked;

    // Step 1: apply cuisine filter
    const cuisineVisible = selectedCuisines.size === 0
      ? baseResults
      : baseResults.filter(p => selectedCuisines.has(getCuisine(p)));

    // Step 2: cuisine filter produces no results
    if (!cuisineVisible.length) {
      setStatus('');
      document.getElementById('resultsMeta').innerHTML = '';
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '';
      const msg = document.createElement('div');
      msg.className = 'empty-state';
      const strong = document.createElement('strong');
      strong.appendChild(document.createTextNode('Cuisine selection is too restrictive to show results'));
      msg.appendChild(strong);
      resultsEl.appendChild(msg);
      return;
    }

    // Step 3: apply Open Now filter — split into known-open and unknown; hide closed
    let primary, unknown;
    if (openNowOn) {
      primary = cuisineVisible.filter(p => p.opening_hours?.open_now === true);
      unknown = cuisineVisible.filter(p => p.opening_hours?.open_now === undefined);
      // open_now === false → omitted entirely
    } else {
      primary = cuisineVisible;
      unknown = null;
    }

    const totalVisible = primary.length + (unknown ? unknown.length : 0);

    // Step 4: update stats strip
    setStatus('');
    const statsEl = document.getElementById('statsStrip');
    if (statsEl) {
      statsEl.style.display = '';
      const scEl = document.getElementById('statsCount');
      if (scEl) scEl.textContent = String(totalVisible);
      const srEl = document.getElementById('statsRadius');
      if (srEl) srEl.textContent = getRadiusMiles() + '\u00a0mi';
    }

    // Step 5: update results header
    const metaEl = document.getElementById('resultsMeta');
    metaEl.innerHTML = '';

    // If results are from the ZIP fallback, show a notice above the header.
    // Uses createElement/createTextNode — never innerHTML — to prevent XSS.
    if (currentFallbackNotice) {
      const notice = document.createElement('div');
      notice.className = 'fallback-notice';
      notice.appendChild(document.createTextNode('No results found for '));
      const zipSpan = document.createElement('strong');
      zipSpan.appendChild(document.createTextNode(currentFallbackNotice.zip));
      notice.appendChild(zipSpan);
      notice.appendChild(document.createTextNode('. Showing results for '));
      const citySpan = document.createElement('strong');
      citySpan.appendChild(document.createTextNode(
        currentFallbackNotice.city + ', ' + currentFallbackNotice.state
      ));
      notice.appendChild(citySpan);
      notice.appendChild(document.createTextNode(' instead.'));
      metaEl.appendChild(notice);
    }

    const hdr = document.createElement('div');
    hdr.className = 'results-header';
    const leftSpan = document.createElement('span');
    leftSpan.className = 'results-header-left';
    const countEl = document.createElement('em');
    countEl.className = 'results-count';
    countEl.appendChild(document.createTextNode(String(totalVisible)));
    leftSpan.appendChild(countEl);
    leftSpan.appendChild(document.createTextNode(
      '\u00a0restaurant' + (totalVisible !== 1 ? 's' : '') + ' that passed'
    ));
    const rightSpan = document.createElement('span');
    rightSpan.className = 'results-header-right';
    rightSpan.appendChild(document.createTextNode('By crowd size \u2193'));
    hdr.appendChild(leftSpan);
    hdr.appendChild(rightSpan);
    metaEl.appendChild(hdr);

    // Step 6: render cards
    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = '';

    if (!totalVisible) {
      const msg = document.createElement('div');
      msg.className = 'empty-state';
      const strong = document.createElement('strong');
      strong.appendChild(document.createTextNode('No open restaurants match the current filters.'));
      msg.appendChild(strong);
      resultsEl.appendChild(msg);
      return;
    }

    renderCardList(primary, resultsEl, 0);

    if (unknown && unknown.length) {
      const divider = document.createElement('div');
      divider.className = 'unknown-divider';
      divider.appendChild(document.createTextNode('Open Hours Unknown'));
      resultsEl.appendChild(divider);
      renderCardList(unknown, resultsEl, primary.length);
    }
  }

  function renderCardList(places, container, startIdx) {
    if (startIdx === undefined) startIdx = 0;
    places.forEach((place, idx) => {
      const cardNum = startIdx + idx + 1;
      const numStr  = cardNum < 10 ? '0' + cardNum : String(cardNum);
      const cuisine = getCuisine(place);
      const price   = PRICE_LABELS[place.price_level];
      const open    = place.opening_hours?.open_now;
      const openTag = open === true
        ? '<span class="tag tag-open">Open now</span>'
        : open === false
          ? '<span class="tag tag-closed">Closed</span>'
          : '';

      // Numeric values: toFixed/toLocaleString return digit strings only — safe from XSS
      const ratingFixed      = place.rating.toFixed(1);
      const reviewsFormatted = place.user_ratings_total.toLocaleString();

      // Crowd bar thresholds
      const reviews = place.user_ratings_total;
      let crowdFilled, crowdLabel;
      if (reviews >= 15000)     { crowdFilled = 9; crowdLabel = 'Very high'; }
      else if (reviews >= 8000) { crowdFilled = 7; crowdLabel = 'High'; }
      else                      { crowdFilled = 5; crowdLabel = 'Moderate'; }
      let crowdBars = '';
      for (let i = 0; i < 11; i++) {
        crowdBars += `<span class="crowd-seg${i < crowdFilled ? ' filled' : ''}"></span>`;
      }

      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-testid', 'restaurant-card');
      card.innerHTML = `
        <div class="card-top-row">
          <div class="card-name-group">
            <span class="card-num">No. ${numStr}</span>
            <span class="card-name">${escHtml(place.name)}</span>
          </div>
          <div class="card-rating-block" aria-label="${ratingFixed} out of 5, ${reviewsFormatted} reviews">
            <div class="stars-row" aria-hidden="true">${starsHtml(place.rating)}</div>
            <div class="rating-score">${ratingFixed}</div>
            <div class="review-count">${reviewsFormatted} reviews</div>
          </div>
        </div>
        <div class="crowd-bar-row">
          <span class="crowd-bar-label">Crowd size</span>
          <div class="crowd-segs">${crowdBars}</div>
          <span class="crowd-bar-text">${crowdLabel}</span>
        </div>
        <div class="card-meta">
          ${price   ? `<span class="tag tag-price">${escHtml(price)}</span>` : ''}
          ${cuisine ? `<span class="tag tag-cuisine">${escHtml(cuisine)}</span>` : ''}
          ${openTag}
        </div>
        <div class="card-address">${escHtml(place.vicinity || '')}</div>`;
      container.appendChild(card);
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Allow pressing Enter to search
  document.getElementById('locationInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startSearch();
  });

  // Close cuisine panel on outside click
  document.addEventListener('click', e => {
    const wrap = document.getElementById('cuisineWrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('cuisinePanel').classList.remove('open');
    }
  });

  // Initialize slider fill and stats radius on load
  updateRadiusLabel();
</script>
