<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://restuarant-finder-link.shivank-sharma.workers.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Proven</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #ededee;
      color: #000;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #8e8adf 0%, #a98ad8 100%);
      padding: 36px 24px 30px;
      text-align: center;
    }

    .header-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.12);
      margin-bottom: 14px;
      color: #000;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #000;
    }

    header p {
      font-size: 0.9rem;
      color: #000;
      margin-top: 7px;
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Search bar (sticky) ─────────────────────────────── */
    .search-bar {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding: 14px 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.07);
    }

    .search-bar input[type="text"] {
      flex: 1 1 140px;
      min-width: 140px;
      padding: 10px 20px;
      border: 1.5px solid #d0d0d0;
      border-radius: 999px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-bar input[type="text"]:focus {
      border-color: #9b97e8;
      box-shadow: 0 0 0 3px rgba(155, 151, 232, 0.18);
    }

    .search-bar button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 22px;
      background: linear-gradient(135deg, #8480d4, #9e82d2);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(132, 128, 212, 0.28);
      transition: opacity 0.15s, box-shadow 0.15s;
    }

    .search-bar button:hover {
      opacity: 0.91;
      box-shadow: 0 4px 16px rgba(132, 128, 212, 0.34);
    }

    .search-bar button:disabled {
      background: linear-gradient(135deg, #c8c6e8, #d6ceed);
      cursor: not-allowed;
      box-shadow: none;
      opacity: 1;
    }

    /* Cuisine trigger overrides .search-bar button — higher specificity wins */
    .search-bar .cuisine-trigger {
      background: #fff;
      color: #333;
      border: 1.5px solid #d0d0d0;
      box-shadow: none;
      font-weight: 500;
      font-size: 0.85rem;
      padding: 8px 14px;
    }

    .search-bar .cuisine-trigger:hover {
      background: #f5f3ff;
      opacity: 1;
      box-shadow: none;
    }

    .radius-control {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      font-size: 0.85rem;
      color: #000;
    }

    .radius-control input[type="range"] {
      width: 110px;
      accent-color: #9b97e8;
      cursor: pointer;
    }

    .radius-label {
      min-width: 44px;
      font-weight: 700;
      color: #000;
    }

    /* ── Open Now toggle ─────────────────────────────────── */
    .toggle-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      color: #000;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    /* Visually hidden but still in tab order via the label */
    .toggle-wrap input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .toggle-track {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: #d0d0d0;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle-wrap input[type="checkbox"]:checked + .toggle-track {
      background: #8480d4;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.2s;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .toggle-wrap input[type="checkbox"]:checked + .toggle-track .toggle-thumb {
      left: 18px;
    }

    /* ── Cuisine filter row ───────────────────────────────── */
    .filter-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 4px;
    }

    .cuisine-wrap {
      position: relative;
    }

    .cuisine-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 8px;
      z-index: 200;
      min-width: 180px;
      max-height: 260px;
      overflow-y: auto;
    }

    .cuisine-panel.open {
      display: block;
    }

    .cuisine-option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 6px;
    }

    .cuisine-option:hover {
      background: #f5f3ff;
    }

    .cuisine-option input[type="checkbox"] {
      accent-color: #8480d4;
      cursor: pointer;
    }

    /* ── Status ──────────────────────────────────────────── */
    .status {
      padding: 12px 24px;
      font-size: 0.875rem;
      color: #000;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 880px;
      margin: 0 auto;
    }

    .status.error { color: #e05252; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #d0d0d0;
      border-top-color: #9b97e8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results meta ────────────────────────────────────── */
    .results-meta {
      padding: 4px 24px 14px;
      max-width: 880px;
      margin: 0 auto;
    }

    .results-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #ede9fe;
      color: #000;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .results-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #b4aee8;
      flex-shrink: 0;
    }

    /* ── Results grid ────────────────────────────────────── */
    .results {
      padding: 0 24px 52px;
      display: grid;
      gap: 14px;
      max-width: 880px;
      margin: 0 auto;
    }

    /* ── Card ────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 14px;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 20px;
      transition: box-shadow 0.18s, transform 0.18s;
    }

    .card:hover {
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .card-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #000;
      grid-column: 1;
      align-self: center;
    }

    /* Rating block: outer column, spans all rows */
    .card-rating-block {
      grid-column: 2;
      grid-row: 1 / 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      align-self: center;
      flex-shrink: 0;
    }

    /* Amber circular badge */
    .rating-badge {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(150deg, #fef3c7, #fde68a);
      border: 2px solid rgba(245, 158, 11, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .rating-score {
      font-size: 1.15rem;
      font-weight: 800;
      color: #78350f;
      line-height: 1;
    }

    .stars-row {
      display: flex;
      gap: 1px;
      margin-top: 3px;
    }

    .review-count {
      font-size: 0.68rem;
      color: #000;
      text-align: center;
      white-space: nowrap;
      line-height: 1.35;
    }

    .card-meta {
      grid-column: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .tag-price   { background: #d1fae5; color: #000; }
    .tag-cuisine { background: #ede9fe; color: #000; }
    .tag-open    { background: #dcfce7; color: #000; }
    .tag-closed  { background: #fee2e2; color: #000; }

    .card-address {
      grid-column: 1;
      font-size: 0.8rem;
      color: #000;
      margin-top: 2px;
    }

    /* ── Open Hours Unknown divider ──────────────────────── */
    .unknown-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 0;
    }

    .unknown-divider::before,
    .unknown-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    /* ── Empty state ─────────────────────────────────────── */
    .empty-state {
      padding: 60px 24px;
      text-align: center;
      color: #000;
      font-size: 0.95rem;
      max-width: 880px;
      margin: 0 auto;
    }

    .empty-state svg {
      display: block;
      margin: 0 auto 20px;
      opacity: 0.38;
    }

    .empty-state strong {
      display: block;
      font-size: 1.05rem;
      color: #000;
      margin-bottom: 6px;
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 520px) {
      .card { grid-template-columns: 1fr; }

      .card-rating-block {
        grid-row: unset;
        flex-direction: row;
        justify-content: flex-start;
        gap: 12px;
      }

      .rating-badge {
        width: 50px;
        height: 50px;
      }

      .rating-score { font-size: 1rem; }
    }
  </style>
</head>
<body>

<!-- Shared SVG defs: half-star gradient, referenced by all star SVGs -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;" aria-hidden="true">
  <defs>
    <linearGradient id="starHalfGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
</svg>

<header>
  <div class="header-icon" aria-hidden="true">
    <!-- Fork and knife icon (inline SVG, no external source) -->
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
      <path d="M7 2v20"/>
      <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
    </svg>
  </div>
  <h1>Proven</h1>
  <p>Find restaurants with more than a 1000 reviews. These represent the most visited and time tested places where the community comes together</p>
</header>

<div class="search-bar">
  <input id="locationInput" type="text" maxlength="100"
         placeholder="Enter ZIP code or city name (e.g. 10001 or Austin, TX)"
         data-testid="location-input" />
  <label class="toggle-wrap" data-testid="open-now-toggle">
    <input type="checkbox" id="openNowToggle" onchange="onOpenNowChange()" />
    <span class="toggle-track"><span class="toggle-thumb"></span></span>
    Open Now
  </label>
  <div class="radius-control">
    <label for="radiusSlider">Radius</label>
    <input id="radiusSlider" type="range" min="1" max="5" step="0.5" value="5"
           oninput="updateRadiusLabel()" data-testid="radius-slider" />
    <span id="radiusLabel" class="radius-label" data-testid="radius-label">5 mi</span>
  </div>
  <button id="searchBtn" onclick="startSearch()" data-testid="search-button">
    <!-- Inline SVG search icon -->
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    Search
  </button>
  <!-- Cuisine filter row — hidden until results load, shown by populateCuisineDropdown() -->
  <div class="filter-row" id="filterRow" style="display:none">
    <div class="cuisine-wrap" id="cuisineWrap">
      <button class="cuisine-trigger" id="cuisineTrigger" onclick="toggleCuisinePanel()">All cuisines &#x25be;</button>
      <div class="cuisine-panel" id="cuisinePanel" role="listbox" aria-multiselectable="true"></div>
    </div>
  </div>
</div>

<div id="status" class="status" data-testid="status"></div>
<div id="resultsMeta" class="results-meta" data-testid="results-meta"></div>
<div id="results" class="results" data-testid="results"></div>

<script>
  const WORKER = 'https://restuarant-finder-link.shivank-sharma.workers.dev/';

  const PRICE_LABELS = { 0: 'Free', 1: '$', 2: '$$', 3: '$$$', 4: '$$$$' };
  const MIN_REVIEWS  = 1000;

  // Filter state — module-level so selections persist across searches
  let baseResults      = []; // 1000+-qualified places, Bayesian-ranked; populated once per search
  let selectedCuisines = new Set(); // empty Set = no filter (all cuisines shown)

  function getRadiusMiles() {
    return parseFloat(document.getElementById('radiusSlider').value);
  }

  function getRadiusMeters() {
    return Math.round(getRadiusMiles() * 1609.34);
  }

  function updateRadiusLabel() {
    const miles = getRadiusMiles();
    document.getElementById('radiusLabel').textContent = miles + ' mi';
  }

  function workerFetch(endpoint, params) {
    const paramStr = new URLSearchParams(params).toString();
    const url = `${WORKER}?endpoint=${encodeURIComponent(endpoint)}&params=${encodeURIComponent(paramStr)}`;
    return fetch(url).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
  }

  function setStatus(msg, isError = false, loading = false) {
    const el = document.getElementById('status');
    el.className = 'status' + (isError ? ' error' : '');
    el.innerHTML = '';
    if (loading) {
      const spinner = document.createElement('div');
      spinner.className = 'spinner';
      el.appendChild(spinner);
    }
    if (msg) el.appendChild(document.createTextNode(msg));
  }

  function startSearch() {
    const raw = document.getElementById('locationInput').value.trim();
    if (!raw) { setStatus('Please enter a ZIP code or city name.', true); return; }

    document.getElementById('results').innerHTML = '';
    document.getElementById('resultsMeta').innerHTML = '';
    setStatus('Geocoding location...', false, true);
    document.getElementById('searchBtn').disabled = true;

    workerFetch('maps/api/geocode/json', { address: raw })
      .then(data => {
        if (data.status !== 'OK' || !data.results.length) {
          setStatus(`Could not find location "${raw}". Try a different ZIP or city.`, true);
          document.getElementById('searchBtn').disabled = false;
          return;
        }
        searchRestaurants(data.results[0].geometry.location);
      })
      .catch(() => {
        setStatus('Could not reach the search service. Please check your network connection.', true);
        document.getElementById('searchBtn').disabled = false;
      });
  }

  function searchRestaurants(location) {
    setStatus('Searching for restaurants...', false, true);
    const allResults = [];

    function fetchPage(pageToken) {
      // On paginated requests send only pagetoken; Google ignores other params
      // when pagetoken is present and some proxies reject the extra fields.
      const params = pageToken
        ? { pagetoken: pageToken }
        : { location: `${location.lat},${location.lng}`, radius: getRadiusMeters(), type: 'restaurant' };

      workerFetch('maps/api/place/nearbysearch/json', params)
        .then(data => {
          if (data.status === 'OK') {
            allResults.push(...data.results);
            if (data.next_page_token) {
              // Google requires ~2s before next_page_token becomes valid
              setTimeout(() => fetchPage(data.next_page_token), 2000);
            } else {
              renderResults(allResults);
            }
          } else if (data.status === 'ZERO_RESULTS') {
            // May happen on a subsequent page; show whatever we already have
            if (allResults.length) {
              renderResults(allResults);
            } else {
              setStatus('No restaurants found near that location.');
              document.getElementById('searchBtn').disabled = false;
            }
          } else {
            // On a mid-pagination error, render whatever was already fetched
            if (allResults.length) {
              renderResults(allResults);
            } else {
              setStatus(`Places API error: ${data.status}`, true);
              document.getElementById('searchBtn').disabled = false;
            }
          }
        })
        .catch(() => {
          if (allResults.length) {
            renderResults(allResults);
          } else {
            setStatus('Could not reach the search service. Please check your network connection.', true);
            document.getElementById('searchBtn').disabled = false;
          }
        });
    }

    fetchPage(null);
  }

  // Inline SVG stars — reference shared gradient in <defs> above for half star
  const STAR_FULL  = '<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#fbbf24"/></svg>';
  const STAR_HALF  = '<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="url(#starHalfGrad)"/></svg>';
  const STAR_EMPTY = '<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#d1d5db"/></svg>';

  function starsHtml(rating) {
    const full  = Math.floor(rating);
    const half  = rating - full >= 0.5 ? 1 : 0;
    const empty = 5 - full - half;
    return STAR_FULL.repeat(full) + (half ? STAR_HALF : '') + STAR_EMPTY.repeat(empty);
  }

  // Keyword → cuisine, matched against lowercased restaurant name
  const NAME_KEYWORDS = [
    ['indian', 'Indian'], ['india', 'Indian'],
    ['madras', 'Indian'], ['tandoor', 'Indian'], ['curry', 'Indian'],
    ['biryani', 'Indian'], ['masala', 'Indian'], ['punjabi', 'Indian'],
    ['kerala', 'Indian'], ['dosa', 'Indian'], ['idli', 'Indian'],
    ['mughal', 'Indian'], ['spice', 'Indian'], ['chai', 'Indian'],
    ['sushi', 'Japanese'], ['ramen', 'Japanese'], ['udon', 'Japanese'],
    ['tempura', 'Japanese'], ['japanese', 'Japanese'], ['izakaya', 'Japanese'],
    ['teriyaki', 'Japanese'], ['yakitori', 'Japanese'],
    ['taco', 'Mexican'], ['burrito', 'Mexican'], ['mexican', 'Mexican'],
    ['cantina', 'Mexican'], ['hacienda', 'Mexican'], ['enchilada', 'Mexican'],
    ['pizza', 'Italian'], ['italian', 'Italian'], ['trattoria', 'Italian'],
    ['osteria', 'Italian'], ['pasta', 'Italian'],
    ['chinese', 'Chinese'], ['dim sum', 'Chinese'], ['wok', 'Chinese'],
    ['szechuan', 'Chinese'], ['sichuan', 'Chinese'], ['cantonese', 'Chinese'],
    ['pho', 'Vietnamese'], ['vietnamese', 'Vietnamese'], ['viet', 'Vietnamese'],
    ['banh mi', 'Vietnamese'],
    ['korean', 'Korean'], ['kimchi', 'Korean'],
    ['thai', 'Thai'], ['pad thai', 'Thai'],
    ['mediterranean', 'Mediterranean'], ['falafel', 'Mediterranean'],
    ['hummus', 'Mediterranean'], ['greek', 'Greek'], ['gyro', 'Greek'],
    ['lebanese', 'Lebanese'], ['shawarma', 'Middle Eastern'],
    ['kebab', 'Middle Eastern'], ['persian', 'Middle Eastern'],
    ['turkish', 'Turkish'],
    ['burger', 'American'], ['bbq', 'BBQ'], ['barbecue', 'BBQ'],
    ['steakhouse', 'Steakhouse'], ['steak', 'Steakhouse'],
    ['seafood', 'Seafood'], ['fish', 'Seafood'], ['crab', 'Seafood'],
    ['french', 'French'], ['brasserie', 'French'], ['bistro', 'French'],
    ['spanish', 'Spanish'], ['tapas', 'Spanish'],
    ['vegan', 'Vegan'], ['vegetarian', 'Vegetarian'],
  ];

  // Types-based fallback (generic)
  const TYPE_CUISINE = {
    indian_restaurant: 'Indian', japanese_restaurant: 'Japanese',
    chinese_restaurant: 'Chinese', mexican_restaurant: 'Mexican',
    italian_restaurant: 'Italian', thai_restaurant: 'Thai',
    vietnamese_restaurant: 'Vietnamese', korean_restaurant: 'Korean',
    mediterranean_restaurant: 'Mediterranean', greek_restaurant: 'Greek',
    french_restaurant: 'French', american_restaurant: 'American',
    barbecue_restaurant: 'BBQ', seafood_restaurant: 'Seafood',
    pizza_restaurant: 'Pizza', sushi_restaurant: 'Sushi',
    ramen_restaurant: 'Ramen', steak_house: 'Steakhouse',
    hamburger_restaurant: 'Burgers', fast_food_restaurant: 'Fast Food',
    breakfast_restaurant: 'Breakfast', bakery: 'Bakery',
    cafe: 'Cafe', bar: 'Bar & Grill', coffee_shop: 'Coffee Shop',
  };

  function getCuisine(place) {
    const name = (place.name || '').toLowerCase();

    // Pass 1: keyword match on restaurant name (most reliable)
    for (const [kw, label] of NAME_KEYWORDS) {
      if (name.includes(kw)) return label;
    }

    // Pass 2: specific type from Places API
    for (const type of (place.types || [])) {
      if (TYPE_CUISINE[type]) return TYPE_CUISINE[type];
    }

    return 'Restaurant';
  }

  // Bayesian rating formula: score = (C * m + R * v) / (m + v)
  // C = mean rating of all qualified results in this search (the global prior)
  // m = 1000 = prior weight — treats every place as though it has 1000 average-rated reviews to start;
  //            places with few real reviews are pulled toward the mean, reducing flukes
  // R = this place's actual rating
  // v = this place's review count
  function bayesianScore(C, m, R, v) {
    return (C * m + R * v) / (m + v);
  }

  function renderResults(all) {
    document.getElementById('searchBtn').disabled = false;

    const qualified = all.filter(p => p.user_ratings_total >= MIN_REVIEWS && p.rating);

    if (!qualified.length) {
      baseResults = [];
      setStatus('');
      document.getElementById('resultsMeta').innerHTML = '';
      document.getElementById('filterRow').style.display = 'none';
      document.getElementById('results').innerHTML = `
        <div class="empty-state">
          <svg width="88" height="88" viewBox="0 0 88 88" fill="none" stroke="currentColor"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <!-- Plate outer ring -->
            <circle cx="34" cy="50" r="22" stroke-width="2.5"/>
            <!-- Plate inner ring -->
            <circle cx="34" cy="50" r="13" stroke-width="1.5"/>
            <!-- Fork (left of plate) -->
            <line x1="10" y1="26" x2="10" y2="36" stroke-width="2.5"/>
            <line x1="7"  y1="26" x2="7"  y2="32" stroke-width="1.5"/>
            <line x1="13" y1="26" x2="13" y2="32" stroke-width="1.5"/>
            <line x1="10" y1="36" x2="10" y2="48" stroke-width="2.5"/>
            <!-- Knife (right of plate) -->
            <path d="M58 26 C58 26 62 30 62 36 L60 42 L60 52" stroke-width="2.5"/>
            <!-- Magnifying glass -->
            <circle cx="60" cy="28" r="16" stroke-width="3"/>
            <line x1="72" y1="40" x2="82" y2="50" stroke-width="3.5"/>
          </svg>
          <strong>No results found</strong>
          No restaurants with 1,000+ reviews found within ${getRadiusMiles()} mile${getRadiusMiles() === 1 ? '' : 's'}.
          <br>Try a different location or city center.
        </div>`;
      return;
    }

    // Compute Bayesian scores once per result set; C is the mean of this specific result set
    const m = 1000;
    const C = qualified.reduce((s, p) => s + p.rating, 0) / qualified.length;
    baseResults = qualified
      .map(p => Object.assign({}, p, { _score: bayesianScore(C, m, p.rating, p.user_ratings_total) }))
      .sort((a, b) => b._score - a._score);

    // Derive cuisine options once from baseResults, before any filtering
    const cuisineSet = new Set(baseResults.map(getCuisine));
    populateCuisineDropdown(cuisineSet);

    applyFilters();
  }

  // Build cuisine checkboxes; preserve prior selection where cuisines still exist in new results
  function populateCuisineDropdown(cuisines) {
    const panel = document.getElementById('cuisinePanel');
    while (panel.firstChild) panel.removeChild(panel.firstChild);

    Array.from(cuisines).sort().forEach(cuisine => {
      const lbl = document.createElement('label');
      lbl.className = 'cuisine-option';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = cuisine;
      // selectedCuisines empty = all shown; otherwise check only previously selected cuisines
      cb.checked = selectedCuisines.size === 0 || selectedCuisines.has(cuisine);
      cb.addEventListener('change', onCuisineChange);

      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode('\u00a0' + cuisine));
      panel.appendChild(lbl);
    });

    document.getElementById('filterRow').style.display = '';
    updateCuisineTriggerLabel();
  }

  function updateCuisineTriggerLabel() {
    const btn = document.getElementById('cuisineTrigger');
    if (!btn) return;
    if (selectedCuisines.size === 0) {
      btn.textContent = 'All cuisines \u25be';
    } else {
      const names = Array.from(selectedCuisines).sort();
      const label = names.length <= 2
        ? names.join(', ')
        : names[0] + ' +' + (names.length - 1) + ' more';
      btn.textContent = label + ' \u25be';
    }
  }

  function toggleCuisinePanel() {
    document.getElementById('cuisinePanel').classList.toggle('open');
  }

  function onCuisineChange() {
    const checkboxes = Array.from(document.querySelectorAll('#cuisinePanel input[type="checkbox"]'));
    const checked = checkboxes.filter(cb => cb.checked).map(cb => cb.value);
    // All checked → empty set sentinel (no filter); some checked → filter to those
    selectedCuisines = checked.length === checkboxes.length ? new Set() : new Set(checked);
    updateCuisineTriggerLabel();
    applyFilters();
  }

  function onOpenNowChange() {
    applyFilters();
  }

  // Single shared function for all filter combinations (cuisine + Open Now)
  function applyFilters() {
    if (!baseResults.length) return;

    const openNowOn = document.getElementById('openNowToggle').checked;

    // Step 1: apply cuisine filter
    const cuisineVisible = selectedCuisines.size === 0
      ? baseResults
      : baseResults.filter(p => selectedCuisines.has(getCuisine(p)));

    // Step 2: cuisine filter produces no results
    if (!cuisineVisible.length) {
      setStatus('');
      document.getElementById('resultsMeta').innerHTML = '';
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '';
      const msg = document.createElement('div');
      msg.className = 'empty-state';
      const strong = document.createElement('strong');
      strong.appendChild(document.createTextNode('Cuisine selection is too restrictive to show results'));
      msg.appendChild(strong);
      resultsEl.appendChild(msg);
      return;
    }

    // Step 3: apply Open Now filter — split into known-open and unknown; hide closed
    let primary, unknown;
    if (openNowOn) {
      primary = cuisineVisible.filter(p => p.opening_hours?.open_now === true);
      unknown = cuisineVisible.filter(p => p.opening_hours?.open_now === undefined);
      // open_now === false → omitted entirely
    } else {
      primary = cuisineVisible;
      unknown = null;
    }

    const totalVisible = primary.length + (unknown ? unknown.length : 0);

    // Step 4: update results badge
    setStatus('');
    const metaEl = document.getElementById('resultsMeta');
    metaEl.innerHTML = '';
    const badge = document.createElement('div');
    badge.className = 'results-badge';
    const dot = document.createElement('span');
    dot.className = 'results-badge-dot';
    badge.appendChild(dot);
    badge.appendChild(document.createTextNode(
      totalVisible + ' restaurant' + (totalVisible !== 1 ? 's' : '') +
      ' with 1,000+ reviews \u2014 Ranked by rating and review count'
    ));
    metaEl.appendChild(badge);

    // Step 5: render cards
    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = '';

    if (!totalVisible) {
      const msg = document.createElement('div');
      msg.className = 'empty-state';
      const strong = document.createElement('strong');
      strong.appendChild(document.createTextNode('No open restaurants match the current filters.'));
      msg.appendChild(strong);
      resultsEl.appendChild(msg);
      return;
    }

    renderCardList(primary, resultsEl);

    if (unknown && unknown.length) {
      const divider = document.createElement('div');
      divider.className = 'unknown-divider';
      divider.appendChild(document.createTextNode('Open Hours Unknown'));
      resultsEl.appendChild(divider);
      renderCardList(unknown, resultsEl);
    }
  }

  function renderCardList(places, container) {
    places.forEach(place => {
      const cuisine = getCuisine(place);
      const price   = PRICE_LABELS[place.price_level];
      const open    = place.opening_hours?.open_now;
      const openTag = open === true
        ? '<span class="tag tag-open">Open now</span>'
        : open === false
          ? '<span class="tag tag-closed">Closed</span>'
          : '';

      // Numeric values: toFixed/toLocaleString return digit strings only — safe from XSS
      const ratingFixed      = place.rating.toFixed(1);
      const reviewsFormatted = place.user_ratings_total.toLocaleString();

      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-testid', 'restaurant-card');
      card.innerHTML = `
        <div class="card-name">${escHtml(place.name)}</div>
        <div class="card-rating-block" aria-label="${ratingFixed} out of 5, ${reviewsFormatted} reviews">
          <div class="rating-badge">
            <div class="rating-score">${ratingFixed}</div>
            <div class="stars-row" aria-hidden="true">${starsHtml(place.rating)}</div>
          </div>
          <div class="review-count">${reviewsFormatted}<br>reviews</div>
        </div>
        <div class="card-meta">
          ${price   ? `<span class="tag tag-price">${escHtml(price)}</span>` : ''}
          ${cuisine ? `<span class="tag tag-cuisine">${escHtml(cuisine)}</span>` : ''}
          ${openTag}
        </div>
        <div class="card-address">${escHtml(place.vicinity || '')}</div>`;
      container.appendChild(card);
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Allow pressing Enter to search
  document.getElementById('locationInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startSearch();
  });

  // Close cuisine panel on outside click
  document.addEventListener('click', e => {
    const wrap = document.getElementById('cuisineWrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('cuisinePanel').classList.remove('open');
    }
  });
</script>

</body>
</html>
